<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #4a4a4a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

#canvas-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 10px solid #333;
    border-radius: 15px;
}

canvas {
    cursor: crosshair;
    display: block;
    background-color: #7a7a7a;
}

#ui-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.8);
    padding: 15px;
    border-radius: 10px;
    pointer-events: auto;
    user-select: none;
    width: 200px;
}

#ui-panel h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
    color: #333;
}

.weather-btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
}

.sunny-btn {
    background: #ffd700; color: #333;
}

.rainy-btn {
    background: #aaddff; color: #333;
}

.active-weather {
    outline: 3px solid #000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

#status-text {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
    text-align: center;
}

</style>
</head>
<body>

<div id="canvas-container">
    <div id="ui-panel">
        <h2>Mossy Rock</h2>
        <button id="sunny-btn" class="weather-btn sunny-btn active-weather">Sunny</button>
        <button id="rainy-btn" class="weather-btn rainy-btn">Rainy</button>
        <div id="status-text">Click to plant moss!</div>
    </div>
    <canvas id="mossCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('mossCanvas');
    const ctx = canvas.getContext('2d');
    const sunnyBtn = document.getElementById('sunny-btn');
    const rainyBtn = document.getElementById('rainy-btn');
    const statusText = document.getElementById('status-text');

    let weather = 'sunny';
    let mossPatches = [];

    // Audio Context for rain sound
    let audioCtx = null;
    let rainNoise = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function createRainSound() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.1;

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        return { source: noise, gain: gainNode };
    }

    function playTapSound(type) {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        
        if (type === 'leaf') {
            // Softer, deeper 'thump' for leaves
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        } else {
            // Sharper 'click' for rock
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function resize() {
        canvas.width = window.innerWidth * 0.8;
        canvas.height = window.innerHeight * 0.8;
    }

    function resizeCanvas() {
        resize();
    }

    window.addEventListener('resize', resizeCanvas);
    resize();

    function drawRock() {
        const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, canvas.width);
        gradient.addColorStop(0, '#888');
        gradient.addColorStop(1, '#666');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, canvas.width/2.2, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawMoss() {
        mossPatches.forEach(patch => {
            ctx.fillStyle = (weather === 'sunny') ? '#8a9a5b' : '#2e8b57';
            ctx.beginPath();
            ctx.arc(patch.x, patch.y, patch.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRock();
        drawMoss();

        if (weather === 'rainy' && audioCtx) {
            if (Math.random() < 0.05) {
                const type = (mossPatches.length > 0 && Math.random() < 0.7) ? 'leaf' : 'rock';
                playTapSound(type);
            }
        }

        requestAnimationFrame(animate);
    }

    canvas.addEventListener('mousedown', (e) => {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        mossPatches.push({ x, y, size: Math.random() * 10 + 5 });
    });

    sunnyBtn.addEventListener('click', () => {
        initAudio();
        weather = 'sunny';
        sunnyBtn.classList.add('active-weather');
        rainyBtn.classList.remove('active-weather');
        if (rainNoise) {
            rainNoise.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            setTimeout(() => rainNoise.source.stop(), 600);
            rainNoise = null;
        }
        statusText.innerText = 'The sun is out!';
    });

    rainyBtn.addEventListener('click', () => {
        initAudio();
        weather = 'rainy';
        rainyBtn.classList.add('active-weather');
        sunnyBtn.classList.remove('active-weather');
        if (!rainNoise) {
            rainNoise = createRainSound();
            rainNoise.source.start();
        }
        statusText.innerText = 'It is raining...';
    });

    animate();
</script>

</body>
</html>
