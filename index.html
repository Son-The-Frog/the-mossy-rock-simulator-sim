<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #4a4a4a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

#canvas-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 10px solid #333;
    border-radius: 15px;
}

canvas {
    cursor: crosshair;
    display: block;
    background-color: #7a7a7a;
}

#ui-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.8);
    padding: 15px;
    border-radius: 10px;
    pointer-events: auto;
    user-select: none;
    width: 200px;
}

#ui-panel h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
    color: #333;
}

.weather-btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
}

.sunny-btn {
    background: #ffd700; color: #333;
}

.rainy-btn {
    background: #aaddff; color: #333;
}

.active-weather {
    outline: 3px solid #000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

#status-text {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
    text-align: center;
}

</style>
</head>
<body>

<div id="canvas-container">
    <div id="ui-panel">
        <h2>Mossy Rock</h2>
        <button id="sunny-btn" class="weather-btn sunny-btn active-weather">Sunny</button>
        <button id="rainy-btn" class="weather-btn rainy-btn">Rainy</button>
        <div id="status-text">Click to plant moss!</div>
    </div>
    <canvas id="mossCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('mossCanvas');
    const ctx = canvas.getContext('2d');
    const sunnyBtn = document.getElementById('sunny-btn');
    const rainyBtn = document.getElementById('rainy-btn');
    const statusText = document.getElementById('status-text');

    let weather = 'sunny';
    let mossPatches = [];

    // Audio Context for rain sound
    let audioCtx = null;
    let rainNoise = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function createRainSound() {
        // Create white noise for the base rain sound
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.1;

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        return { source: noise, gain: gainNode };
    }

    function playTapSound() {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        // Higher pitch for rock, slightly lower for moss
        const isMoss = mossPatches.length > 0 && Math.random() > 0.5;
        osc.frequency.setValueAtTime(isMoss ? 800 : 1200, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
    }

    function resize() {
        canvas.width = window.innerWidth * 0.8;
        canvas.height = window.innerHeight * 0.8;
    }

    function resizeCanvas() {
        resize();
    }

    window.addEventListener('resize', resizeCanvas);
    resize();

    function drawRock() {
        const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, canvas.width);
        gradient.addColorStop(0, '#888');
        gradient.addColorStop(1, '#666');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawMoss(patch) {
        const isRainy = weather === 'rainy';
        const color = isRainy ? 'rgba(34, 139, 34, 0.8)' : 'rgba(107, 142, 35, 0.8)';
        const size = isRainy ? patch.size * 1.2 : patch.size;
        
        ctx.beginPath();
        ctx.arc(patch.x, patch.y, size, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(patch.x + (Math.random() - 0.5) * 10, patch.y + (Math.random() - 0.5) * 10, size * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }
    }

    function render() {
        drawRock();
        mossPatches.forEach(drawMoss);
        requestAnimationFrame(render);
    }

    canvas.addEventListener('mousedown', (e) => {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        mossPatches.push({ x, y, size: 10 + Math.random() * 10 });
    });

    sunnyBtn.addEventListener('click', () => {
        initAudio();
        weather = 'sunny';
        sunnyBtn.classList.add('active-weather');
        rainyBtn.classList.remove('active-weather');
        if (rainNoise) {
            rainNoise.gain.gain.setValueAtTime(0, audioCtx.currentTime);
            rainNoise.source.stop(audioCtx.currentTime + 0.1);
            rainNoise = null;
        }
    });

    rainyBtn.addEventListener('click', () => {
        initAudio();
        weather = 'rainy';
        rainyBtn.classList.add('active-weather');
        sunnyBtn.classList.remove('active-weather');
        if (!rainNoise) {
            rainNoise = createRainSound();
            rainNoise.source.start();
        }
    });

    // Randomly trigger tap sounds during rain
    setInterval(() => {
        if (weather === 'rainy') {
            if (Math.random() > 0.7) {
                playTapSound();
            }
        }
    }, 150);

    render();
</script>
</body>
</html>
