<html>
<head>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #4a4a4a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

#canvas-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 10px solid #333;
    border-radius: 15px;
    filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
}

canvas {
    cursor: crosshair;
    display: block;
    background-color: #7a7a7a;
    border-radius: 5px;
}

#ui-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.8);
    padding: 15px;
    border-radius: 10px;
    pointer-events: auto;
    user-select: none;
    width: 200px;
    z-index: 10;
}

#ui-panel h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
    color: #333;
}

.weather-btn {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
}

.sunny-btn {
    background: #ffd700; color: #333;
}

.rainy-btn {
    background: #aaddff; color: #333;
}

.active-weather {
    outline: 3px solid #000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

#sound-toggle {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    border: 1px solid #999;
    border-radius: 5px;
    cursor: pointer;
    background: #eee;
    font-size: 13px;
}

#status-text {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
    text-align: center;
}

</style>
</head>
<body>

<div id="canvas-container">
    <div id="ui-panel">
        <h2>Mossy Rock</h2>
        <button id="sunny-btn" class="weather-btn sunny-btn active-weather">Sunny</button>
        <button id="rainy-btn" class="weather-btn rainy-btn">Rainy</button>
        <button id="sound-toggle">Sound: On</button>
        <div id="status-text">Click to plant moss!</div>
    </div>
    <canvas id="mossCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('mossCanvas');
    const ctx = canvas.getContext('2d');
    const sunnyBtn = document.getElementById('sunny-btn');
    const rainyBtn = document.getElementById('rainy-btn');
    const soundToggle = document.getElementById('sound-toggle');
    const statusText = document.getElementById('status-text');

    let weather = 'sunny';
    let mossPatches = [];
    let soundEnabled = true;

    // Audio Context for rain sound
    let audioCtx = null;
    let rainNoise = null;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function createRainSound() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.1;

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        return { source: noise, gain: gainNode };
    }

    function playTapSound(type) {
        if (!audioCtx || !soundEnabled) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        
        if (type === 'leaf') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        } else {
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function resizeCanvas() {
        canvas.width = 600;
        canvas.height = 400;
    }

    function drawRock() {
        // Background
        ctx.fillStyle = '#7a7a7a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Adding a soft shadow gradient to the bottom of the rock
        const gradient = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height);
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawMoss() {
        mossPatches.forEach(patch => {
            const color = weather === 'sunny' ? '#8db600' : '#4b631d';
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(patch.x, patch.y, patch.radius, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawRain() {
        if (weather !== 'rainy') return;
        ctx.strokeStyle = 'rgba(170, 194, 255, 0.5)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 20; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 10);
            ctx.stroke();
        }
    }

    function update() {
        drawRock();
        drawMoss();
        drawRain();
        requestAnimationFrame(update);
    }

    canvas.addEventListener('mousedown', (e) => {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        mossPatches.push({
            x: x,
            y: y,
            radius: Math.random() * 15 + 5
        });
        
        if (weather === 'rainy') {
            playTapSound('rock');
        }
    });

    sunnyBtn.addEventListener('click', () => {
        weather = 'sunny';
        sunnyBtn.classList.add('active-weather');
        rainyBtn.classList.remove('active-weather');
        if (rainNoise) rainNoise.source.stop();
        rainNoise = null;
    });

    rainyBtn.addEventListener('click', () => {
        weather = 'rainy';
        rainyBtn.classList.add('active-weather');
        sunnyBtn.classList.remove('active-weather');
        initAudio();
        if (!rainNoise) {
            rainNoise = createRainSound();
            rainNoise.source.start();
        }
    });

    rainyBtn.addEventListener('click', () => {
        weather = 'rainy';
        rainyBtn.classList.add('active-weather');
        sunnyBtn.classList.remove('active-weather');
        initAudio();
        if (!rainNoise) {
            rainNoise = createRainSound();n
            rainNoise.source.start();
        }
    });

    soundToggle.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundToggle.textContent = `Sound: ${soundEnabled ? 'On' : 'Off'}`;
        if (!soundEnabled && rainNoise) {
            rainNoise.gain.gain.value = 0; // Simplified for this step
        } else if (soundEnabled && rainNoise) {
            rainNoise.gain.gain.value = 0.1;
        }
    });

    resizeCanvas();
    update();
</script>
</body>
</html>
